name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build executable
        run: .\build.bat

      - name: Verify release asset
        shell: pwsh
        run: |
          $asset = '.\dist\HustNetwork_GUI.exe'
          $checksum = '.\dist\SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $asset)) {
            throw "Expected release asset was not created: $asset"
          }
          Get-Item -LiteralPath $asset | Select-Object Name, Length
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  HustNetwork_GUI.exe" | Set-Content -LiteralPath $checksum -Encoding ascii
          Get-Content -LiteralPath $checksum

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = '.\dist\HustNetwork_GUI.exe'
          $checksum = '.\dist\SHA256SUMS.txt'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksum --clobber
          } else {
            gh release create $tag $asset $checksum --title $tag --generate-notes
          }
